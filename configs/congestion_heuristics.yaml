# Congestion heuristic scenarios
# Run with:
#   evac-sim run --config congestion_heuristics.yaml --heuristic none
#   evac-sim run --config congestion_heuristics.yaml --heuristic h1 --beta 1.0
#   evac-sim run --config congestion_heuristics.yaml --heuristic h2 --beta 1.0 --horizon-k 3

congestion_parallel_corridors:
  environment: "parallel_corridors"
  sources: ["1", "9"]
  agents: [45, 45]
  targets: ["23", "18"]
  mode_type: 0
  master_seed: 3101

  grouping:
    enabled: true
    distribution: "normal"
    max_group_size: 5
    min_group_size: 1
    mean_group_size: 3
    std_group_size: 2
    seed: 3201

  congestion:
    edge_capacity_multiplier: 1.0
    use_linear_congestion_cost: true
    block_edges_at_capacity: true
    no_path_policy: "wait"
    temporal_capacity:
      enabled: true
      node_capacity_enabled: true
      edge_flow_enabled: true
      temporal_reservation_enabled: true
      time_bucket_frames: 30
      temporal_horizon_frames: 300
      traversal_time_scale: 1.0
      node_capacity_default: 20
      edge_flow_capacity_default: 10
      beta_edge: 1.0
      beta_node: 1.0
      edge_capacity_exponent: 1.0
      node_capacity_exponent: 1.0
      wait_penalty: 0.0
      allow_waiting: true
      block_at_capacity: true

  risk_iterations: 1500
  risk_increase_chance: 0.0
  starting_risks: []
  risk_overrides: []
  risk_threshold: 0.5
  propagation_threshold: 0.5
  gamma: 0.3
  stairs_max_speed: 0.6
  normal_max_speed: 1.2
  every_nth_frame_simulation: 3
  every_nth_frame_animation: 25
  danger_visualization_frame: 300

