[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evac-sim"
version = "0.1.0"
description = "Evacuation simulation framework"
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "PyYAML",
  "networkx",
  "jupedsim",
  "pedpy",
]

[project.scripts]
evac-sim = "evac_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "pytest",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]